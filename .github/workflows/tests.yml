name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Konventionen prüfen
        run: uv run python scripts/check.py
      - name: Unit-Tests
        run: uv run pytest
