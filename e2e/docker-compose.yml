# Wegwerf-Instanz von Open WebUI für den End-to-End-Test.
# Ohne Anmeldung und ohne angebundene Sprachmodelle; als Modell dient die Pipe „echo“.
# Version bewusst fest: beim Update von Open WebUI hier anheben und den Test laufen lassen.
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.3
    ports:
      - "3000:8080"
    environment:
      WEBUI_AUTH: "False"
      WEBUI_SECRET_KEY: "nur-fuer-lokale-tests"
      ENABLE_OLLAMA_API: "False"
      ENABLE_OPENAI_API: "False"
      OFFLINE_MODE: "True"
      HF_HUB_OFFLINE: "1"
      # kein lokales Embedding-Modell laden; der Test braucht keine Dokumentensuche
      RAG_EMBEDDING_ENGINE: "ollama"
      ANONYMIZED_TELEMETRY: "False"
      DO_NOT_TRACK: "True"
      SCARF_NO_ANALYTICS: "True"
    tmpfs:
      - /app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 60
